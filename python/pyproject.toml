[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hypercast"
version = "0.1.0"
description = "Allocation-free scalar parsing — booleans, numerics, UUIDs, temporals — as a Success/Fault verdict union (value or reason + offending span, never an exception), ctypes bindings straight into a native Rust core (libhypercast). No runtime bridge, no dependencies."
readme = "README.md"
license = "MIT"
authors = [{ name = "Brian Buvinghausen" }]
# 3.10 floor deliberately: match/case over the Success | Fault union is the consumption
# idiom, the Python answer to C#'s native union and Java's sealed interface.
requires-python = ">=3.10"
dependencies = []

[project.urls]
Repository = "https://github.com/SkunkWerkx/HyperCast"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/hypercast"]

[tool.hatch.build.targets.wheel.force-include]
"src/hypercast/libhypercast.so" = "hypercast/libhypercast.so"
