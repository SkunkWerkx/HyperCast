[build-system]
# 1.9 is the first maturin with full PEP 639 support — the SPDX `license` string and the
# top-level `license-files` below. An older one does not build this file.
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "hypercast"
# Baked from rust/Cargo.toml at build time by maturin (manifest-path below) — the one
# version source of truth, no second literal to drift.
dynamic = ["version"]
description = "Allocation-free scalar parsing — booleans, numerics, UUIDs, temporals — as a Success/Fault verdict union (value or reason + offending span, never an exception). A PyO3 native extension linking a Rust core directly into CPython — no runtime bridge, no compiler needed to install, no dependencies."
readme = "README.md"
license = "MIT"
# A local copy, not a path up to the repo root: PEP 639 globs forbid `..` outright
# ("the parent directory operator (`..`) at position 0 is not allowed"), and a symlink is
# no better. Same reason rust/ carries its own — git stores one blob for all of them.
license-files = ["LICENSE"]
authors = [{ name = "Brian Buvinghausen" }]
# 3.11 floor: the oldest CPython still in upstream support (3.10 ends 2026-10-31). It is
# comfortably past what the consumption idiom needs — match/case over the Success | Fault
# union, the Python answer to C#'s native union and Java's sealed interface, arrived in
# 3.10 — and it puts `typing.assert_never` in the standard library. The wheel is built
# abi3-py311, so one wheel per platform covers the whole floor-and-up range.
requires-python = ">=3.11"
dependencies = []
keywords = ["parsing", "ffi", "verdict", "rfc3339", "pyo3"]
# No `License ::` classifier: PEP 639 deprecates them in favour of the `license` expression
# above, and the two are not meant to be declared together.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: WebAssembly :: Emscripten",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/SkunkWerkx/HyperCast"
Repository = "https://github.com/SkunkWerkx/HyperCast"
Issues = "https://github.com/SkunkWerkx/HyperCast/issues"

[project.optional-dependencies]
# mypy is what tests/test_typing.py checks a consumer's match with; those tests skip without it.
test = ["pytest>=8.0", "mypy>=1.11"]
bench = ["pyperf>=2.6"]

[tool.maturin]
manifest-path = "../rust/Cargo.toml"
python-source = "src"
module-name = "hypercast._native"
features = ["python"]

[tool.ruff]
# One width for the package, its tests and its benchmark, the Rust core's own (rustfmt.toml).
line-length = 100
# Code only: the README's examples are laid out by hand.
extend-exclude = ["*.md"]

[tool.ruff.lint]
# Doc-comment enforcement only — the "missing docstring" family of pydocstyle rules
# (D100-D107), not the full pydocstyle convention (imperative mood, blank-line placement,
# etc.), which isn't this project's existing comment style and isn't what "force
# documentation" is asking for.
select = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
