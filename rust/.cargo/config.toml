# macOS: a Python/Ruby extension module must not link the host runtime (libpython,
# libruby) — the Py*/rb_* symbols resolve from the host process when the extension loads,
# so the linker has to be told to leave them undefined (`dynamic_lookup`). maturin
# arranges this itself for the python feature's release wheel build; a plain `cargo build`
# (this repo's dev loop, CI, and the ruby feature, which has no maturin-equivalent
# wrapper) does not, so it's declared here. Harmless for the default (no extension
# feature) build too — a cdylib with no undefined symbols is unaffected by the flag either
# way. Linux permits undefined symbols in shared libraries by default, which is why only
# the Darwin targets need this. (Learned the hard way in this repo's own CI bring-up —
# the fix originally lived in the satellite extension crates' .cargo/config.toml files;
# it moved here when the extensions were consolidated into the core crate as features.)
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-Wl,-undefined,dynamic_lookup"]

# wasm32-wasip1 is the one target where a host cannot hand this library a pointer into its
# own memory: a wasm guest only sees its own linear memory, so every host that embeds the
# module (GraalWasm in the Java binding, wasmtime in the Ruby/Python/Go ones) has to ask the
# guest for the buffers it fills — the input text, the out-value, the fault span, the
# NumFormat. wasi-libc's malloc/free are already linked in (Rust's std allocator on this
# target sits on them); exporting them costs nothing and keeps ffi.rs's "plain pointers, no
# allocator protocol" contract untouched for every native platform. Linker flags rather than
# #[no_mangle] shims, so the C ABI surface stays exactly the twenty cast_* exports on every
# other target.
#
# Using the guest's allocator, rather than a host-picked offset past the data segments, is
# load-bearing: dlmalloc claims the tail of the initial memory on first use, and HyperUuid
# observed a batch written there corrupted by the host's very next allocation. Cargo only
# reads this file from the crate directory (`cargo build` run inside rust/), the same way
# every other target section here already relies on.
[target.wasm32-wasip1]
rustflags = ["-C", "link-arg=--export=malloc", "-C", "link-arg=--export=free"]
