# The crate the way a browser consumer depends on it: wasm32-unknown-unknown, default
# features, nothing else. The core reads no clock and no entropy, so unlike HyperUuid's
# browser test there is no getrandom backend to switch on from the consumer's side.
# `wasm-pack test --headless --chrome` runs tests/browser.rs inside a real browser; CI does the
# same on every PR. Not published, and not part of the crate's package: cargo leaves a nested
# package out of `cargo package`.
[package]
name = "hypercast-browser-test"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
hypercast = { path = ".." }

[dev-dependencies]
wasm-bindgen-test = "0.3"
