[package]
name = "hypercast"
version = "0.7.0"
edition = "2024"
rust-version = "1.88"
description = "Allocation-free parsers for scalars from untrusted text — booleans, numerics, UUIDs, and temporals. Every parse returns a verdict (the value, or a closed reason code with the offending span), never throws, never allocates — wrapped as a native library (libhypercast) for direct FFI from every host language."
license = "MIT"
readme = "README.md"
repository = "https://github.com/SkunkWerkx/HyperCast"
keywords = ["parser", "ffi", "allocation-free", "rfc3339", "protobuf"]
categories = ["parsing", "no-std", "no-std::no-alloc"]

# Only the rlib is declared. The shared library every binding loads is built by naming its
# crate type on the command line (`cargo cdylib`, an alias in .cargo/config.toml), the way
# the static libraries already are. Cargo builds every crate type a dependency lists, and a
# cdylib is a linked artifact that needs a panic handler: while `cdylib` was listed
# here, a `default-features = false` consumer failed to build on any target able to produce
# one (the host, wasm32-unknown-unknown), and only bare-metal targets worked.
[lib]
crate-type = ["rlib"]

[dependencies]
# Deliberately none for the plain build — the core is pure parsing over caller-supplied
# bytes. The extension backends below are additive and off by default.
pyo3 = { version = "0.27", features = ["extension-module", "abi3-py311"], optional = true }
magnus = { version = "0.9", features = ["rb-sys"], optional = true }
rb-sys = { version = "0.9", optional = true }
ext-php-rs = { version = "0.16", optional = true }
# Build-time check only, never shipped: see the `no-panic` feature.
no-panic = { version = "0.1", optional = true }

# One crate, three optional native-extension entry points instead of three satellite crates
# each path-depending back on this one (HyperUuid's consolidation, ported home). Nothing
# in a plain `cargo cdylib` (the Fiddle/ext-ffi-consumed shared library every non-extension
# binding dlopens) changes — these are additive, off by default, and only one is ever enabled per
# build invocation (each produces a different C entry point — PyInit__native,
# Init_hypercast_native, PHP's module struct — under the same crate, not meant to coexist
# in one binary). The php one is a benchmark spike, exactly as in HyperUuid: the shipped
# PHP package is ext-ffi; see src/php_ext.rs.
[features]
# On by default for the crates.io consumer, the test suite and the benchmarks; no artifact
# this repo ships is built with it except the extension modules and the wasm32-wasip1
# module (whose hosts depend on the malloc/free exports std's allocator brings). The parsing
# core itself is core-only — `default-features = false` gives a genuine `#![no_std]` rlib on
# every target, which is what the crate's published `no-std` category means. The extension
# backends all require std through their own dependencies, so they name it explicitly
# rather than relying on the default.
default = ["std", "exports"]
std = []
# The 25 `cast_*` C ABI symbols, and `hypercast_version` as a symbol rather than only a Rust
# function. On by default, and implied by every feature that builds a library of this
# crate's own, so nothing this repo ships changes. It exists to be turned off: a
# `#[no_mangle]` item is exported from whatever library the crate is linked into, so a
# crate that links this one as an rlib and exports a C ABI of its own (the tabular layer)
# would carry all 26 symbols in its own library, and its static archive could not be
# linked into one program with libhypercast.a (`multiple definition of cast_bool`). Such a
# consumer takes `default-features = false` and names `std` again if it wants it.
exports = []
# The no_std static libraries, for the hosts that link the core in rather than load it: a
# Blazor WebAssembly app (the NuGet package, wasm32-unknown-emscripten), a Swift executable
# on Linux or WebAssembly, a Go binary built with cgo, and a C# Native AOT publish. A
# static library is a final artifact as far as panics go, so with `std` off it needs the
# `#[panic_handler]` std would have supplied; this feature is that handler and nothing else
# (see lib.rs). It exists so those libraries carry no copy of Rust's standard library: two
# Hyper* static libraries that each bundled std could not be linked into one program
# (`duplicate symbol: rust_eh_personality`). Off by default, and never for an rlib consumer,
# who supplies a handler of their own.
staticlib = ["exports"]
# The shared library every non-extension binding dlopens (`cargo cdylib`), built without
# Rust's standard library: the `staticlib` panic handler plus what a no_std shared library
# needs that a static library does not (lib.rs has what and why). The parse is the same
# code either way; what std added was its runtime — the unwinder, the backtrace symbolizer
# and the allocator, ~330 KB of the 437 KB linux-x64 library, none of it reachable from a
# C ABI export. Leaving std out also leaves every import but the C library's `abort`,
# `memcpy`, `memset` and `bcmp` out, so on musl the library no longer needs libgcc_s. A
# panic was already a process abort at an `extern "C"` boundary under std; it is the same
# abort here, only without the message printed first. Off by default, and never for an
# rlib consumer.
cdylib = ["staticlib"]
# The core's values as Python objects (src/python.rs, `hypercast::python`), for any crate
# whose own CPython extension presents them — this crate's extension below, and
# HyperTabular's.
python-values = ["dep:pyo3", "std"]
python = ["python-values"]
ruby = ["dep:magnus", "dep:rb-sys", "std"]
php = ["dep:ext-php-rs", "std"]
# Proves at link time that no C ABI export can panic: `cargo no-panic` (.cargo/config.toml)
# fails with an undefined-symbol error naming any export the optimizer could not clear of
# every panic path (dtolnay's no-panic). A check, not a build of anything shipped. The
# doors' contract is "never panics on bad input"; at an `extern "C"` boundary a panic is
# a process abort in the host, so this is the guarantee that matters, and it has to be
# re-proved per compiler release because whether a bounds check survives is the
# optimizer's call. Release builds only — debug keeps every check. Built with std rather
# than as the shipped no_std library, because no-panic detects a panic path by the unwind
# edge it leaves, and a no_std build has to abort; the exports' code is the same either way.
no-panic = ["dep:no-panic", "exports"]

[dev-dependencies]
# default-features off drops rayon/plotters, which cannot build for wasm32-wasip1 —
# dev-dependencies compile for every test target, wasm test runs included.
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
serde_json = "1"
uuid = "1"
time = { version = "0.3", features = ["parsing"] }

[[bench]]
name = "cast_benchmarks"
harness = false

# Size, not speed. Measured on win-x64 in the sibling HyperUuid crate (Ruby 3.4, already
# carrying `-C strip=symbols`): the Magnus extension goes 1,102,336 -> 1,040,384 bytes, -5.6%,
# with .text 842,336 -> 792,704 and all exports intact. Every leg's artifact shrinks, not just
# that one, so it reaches the gems, wheels and the NuGet payload alike.
#
# Explicitly NOT a performance change, checked rather than hoped: interleaved A/B runs of the
# same 200k-iteration probe put LTO and stock within noise of each other. An earlier
# single-shot reading suggested a ~12% win; that was cross-session noise and did not survive
# being run back to back. Worth re-measuring here before quoting any number in this repo's own
# benchmark docs — the finding transfers, the exact bytes do not.
#
# Scope worth knowing: Cargo ignores a dependency's profile settings, so this applies to
# builds *of this repo* — every binding's cdylib, the extension features, `cargo bench` — and
# never to a downstream crates.io consumer, who gets their own workspace's profile.
#
# Cargo only passes `-C lto` for a cdylib built as the invocation's one crate type, which is
# what `cargo cdylib` is: the plain linux-x64 library was 457,008 bytes that way while it
# still carried std (110,048 since), against 535,440 from a manifest that listed
# `["cdylib", "rlib"]`, at the same speed (the timestamp, uuid and bool doors through the
# C ABI, alternating runs, within noise).
#
# strip drops the symbol table and debug info from what is linked, never the exports, and
# never the code: the stripped linux-x64 library's .text is byte-identical to the unstripped one.
# Measured on local linux-x64 builds, stripped against unstripped: the shared library goes
# 110,048 → 104,496 bytes (the last one CI staged unstripped was 109,736), the wasm32-wasip1 module
# 137,432 → 126,724 and the Linux Magnus extension 551,736 → 457,400 (a platform gem ships
# two). Windows already got this for the Magnus build from the forge's RUSTFLAGS; this is
# every other leg.
# A static library is not linked, so the archives keep their symbols — they are how the
# consumer's linker finds the core.
[profile.release]
lto = true
codegen-units = 1
strip = true

# A profiler needs the symbols the release profile strips.
[profile.bench]
strip = false

# The profile the `staticlib` feature's libraries are built with (`cargo staticlib`, in
# .cargo/config.toml): release, plus panics that abort. A no_std artifact cannot unwind —
# rustc refuses the build otherwise ("unwinding panics are not supported without std") —
# and a profile carries that to every dependency on every target, where a per-target
# rustflags entry would have to be repeated for each one.
[profile.staticlib]
inherits = "release"
panic = "abort"
