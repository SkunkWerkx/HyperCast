# Cast.Downcalls holds the FFM downcall handles and nothing that needs the native library.
# Initialized when the image is built, they are constants in the image and Native Image
# compiles the calls through them; left to initialize at run time, every door goes through
# the method-handle interpreter instead, at microseconds apiece. interop.NativeValues is
# here for the same reason: its big-endian layout must be a constant for the uuid read to
# be one instruction, for this jar's doors and for any library that reads with it.
Args = --initialize-at-build-time=io.github.skunkwerkx.hypercast.Cast$Downcalls,io.github.skunkwerkx.hypercast.interop.NativeValues
