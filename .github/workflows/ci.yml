name: CI — build native, build wasm, test every binding

# The build/test matrix lives in HyperForge (SkunkWerkx/.github) as the canonical Hyper*
# pipeline — 5 real-hardware legs plus the two musl RIDs in Alpine containers (and osx-x64
# cross-built on the Apple silicon runner, the core's own suite run under Rosetta), the Rust core
# built fresh per leg, every binding's suite run against it. Ruby's suite runs on the
# Magnus extension once per Ruby ABI on the seven RIDs that get a platform gem — the musl
# ones in each Ruby's Alpine image; osx-x64 is cross-built and has no binding suite or
# extension of its own — and once more forced onto the Fiddle fallback; Python has no
# fallback — PyO3 only, staged and tested per leg.
#
# The forge is one canonical pipeline, and this repo conforms to it rather than the other
# way round. When the forge assumes something HyperUuid's crate has and this one lacks,
# this crate gets the same thing — never a forge input, opt-out, or auto-detection to
# route around the difference. The receipt: the forge builds `--features php` on every
# darwin/linux leg (in release mode), this crate had no such feature, and the fix was carrying HyperUuid's
# ext-php-rs spike behind a `php` feature (rust/src/php_ext.rs), not gating the forge.
#
# CI's job is build, test, and upload reusable artifacts. Every native leg builds+tests
# fresh, and the raw outputs (the plain FFI libhypercast.so/.dylib/.dll, the compiled Ruby
# Magnus extension) get uploaded here for later reuse, as do the nine PyPI wheels, which
# are built, installed and called into on every run (build-wheels below). The .nupkg and
# the gems are still packed in release.yml, at tag time, from this run's libraries.
#
# None of it is version-agnostic: each native library reports the crate version it was
# built at (`hypercast_version()`), and a wheel carries it in its file name. So the run a
# release reuses has to be one that ran against the version-bump commit, which is why
# prepare-release.yml dispatches this workflow after it pushes the bump — see release.yml's
# find-ci-run for the gate. 0.3.0 shipped libraries reporting 0.2.0 because that gate did
# not exist yet.
#
# No push trigger, deliberately: stage-native-binaries.yml and prepare-release.yml both
# direct-push mechanical bot commits, and a stray matrix run on each of those would be
# wasted compute (HyperUuid checked the branch-protection theory against reality — master
# isn't protected; the trigger choice is the whole mechanism). The bump is the one push
# that does need a run, and prepare-release.yml asks for it explicitly.

on:
  pull_request:
  workflow_dispatch:
  # The whole release-mode board once a week, so arm64, musl, iOS, the wheels and the second
  # Ruby ABI are exercised between releases instead of first on release day.
  schedule:
    - cron: "0 6 * * 1"

# A new push to a PR supersedes its running board; anything else runs to completion.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    # attest-build-provenance signs with an OIDC token and records the result, and a reusable
    # workflow can never escalate beyond what its caller was granted — so these two scopes have
    # to be handed down from here. contents stays read: nothing in the called workflow writes.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: every leg and suite, nothing only a release needs (see the forge's README).
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      project: HyperCast
      crate: hypercast
      pure_env: HYPERCAST_PURE
      # Four more static libraries in the static-libs artifact: iOS, the iOS simulator and
      # Mac Catalyst (test-apple-mobile, below, is what links and runs them).
      apple_mobile: true
      # Android: the shared library for android-arm64 and android-x64 (what a C# app on
      # CoreCLR loads out of its APK), and in static-libs their archives for C#'s Native AOT,
      # Go's go/staticlib and Swift's bundle. test-android, below, is what runs them.
      android: true
      csharp_test_project: csharp/HyperCast.Tests/HyperCast.Tests.csproj
      # .NET 11 is HyperCast's floor for the native [Union] Verdict types — preview quality
      # until the pinned SDK GAs (HyperForge's own default stays 8.0/ga for other repos).
      dotnet_version: "11.0.x"
      dotnet_quality: "preview"
      # Turns the package's Native AOT claim into a per-platform receipt: the forge publishes
      # this project under PublishAot on all five legs, fails on any ILxxxx/AOTxxxx trim
      # diagnostic, then runs the produced binary and requires exit 0. The log uploads as
      # aot-report-{rid}. The smoke test exercises a door from every family plus the union's
      # compile-checked consumption, so it covers the AOT-sensitive surface, not one call.
      csharp_aot_project: csharp/HyperCast.AotSmokeTest/HyperCast.AotSmokeTest.csproj
      # Both explicit-placement inputs stay set. The original reason no longer holds — it
      # was that the separate per-binding test jobs downloaded the native artifact but
      # never ran cargo, so the csproj/Gradle dev-loop staging from rust/target/release
      # had nothing to stage, and leaving these empty meant DllNotFoundException on every
      # C# leg and an ExceptionInInitializerError on every Java leg (found by this repo's
      # first real matrix run, not assumed). Since the forge collapsed those jobs into
      # build-native (2026-09), cargo runs in the same job and rust/target/release is
      # populated, so the dev-loop staging would now find it.
      #
      # Kept anyway, deliberately: explicit placement puts the library at
      # runtimes/{rid}/native/ and src/main/resources/native/{rid}/ — the same layouts the
      # shipped NuGet package and jar actually use — whereas the dev-loop staging only
      # produces a flat copy beside the assembly. Testing the layout consumers get is the
      # point; falling back to the flat copy would still pass while proving less.
      csharp_runtimes_dir: csharp/HyperCast/runtimes
      java_resources_dir: java/src/main/resources/native
      # The forge's ruby_version default (4.0, the current release) is the primary ABI; this
      # adds a second Magnus build+suite against 3.4 so each platform gem can ship both. A
      # Magnus extension is bound to one Ruby minor — unlike PyO3's abi3 wheels, which is why
      # Python needs no equivalent input. Keep this in step with ruby/Rakefile's ABIS and
      # release.yml's own ABIS list; the rake task aborts naming the missing file if they
      # drift. Ruby 3.4 goes EOL 2028-03-31 — clear this line then and 3.4 consumers fall
      # back to the universal Fiddle gem, which is exactly what it's there for.
      ruby_compat_version: "3.4"
      # The core as a wasm32-wasip1 module too, and the Java suite a second time through its
      # in-process GraalWasm backend. The module is what the jar carries beside the native
      # libraries so a JVM on a platform with no native build still has a working backend.
      wasip1_module: true

  # The C#/NuGet browser-wasm staticlib — built on every PR, not just at release time, so
  # a wasm-breaking core change surfaces immediately.
  build-wasm:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wasm.yml@master
    # Handed down for the same reason as build-native's: the ruby.wasm job attests the
    # archives the companion gem ships.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: every leg and suite, nothing only a release needs (see the forge's README).
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypercast
      project: HyperCast
      # Every browser target runs in headless Chrome, not just built: the Blazor smoke app
      # linking the archive above, the crate itself for wasm32-unknown-unknown, and the Go
      # binding compiled by TinyGo with this commit's wasm32-wasip1 archive linked in. And
      # in release mode (weekly and release, not PRs) the Magnus extension, built for each
      # Ruby minor the -wasm gem carries, linked into a ruby.wasm interpreter and run under
      # Node and in headless Chrome; those archives are uploaded as ruby-wasm-{minor} for
      # release.yml.
      blazor_check: csharp/HyperCast.WasmSmokeTest/check.sh
      rust_browser_test: rust/browser-test
      go_tinygo_smoke: go/internal/tinygosmoke
      ruby_wasm_smoke: ruby/wasm-smoke

  # The nine PyPI wheels, on every run rather than only at the tag: built by maturin,
  # installed on their own platform (the musl ones on a bare Alpine image, osx-x64 under
  # Rosetta, the Pyodide one in Pyodide under Node and in headless Chrome, where the whole
  # pytest suite runs too), called into, attested and uploaded as pypi-wheels-{rid}. release.yml
  # publishes these exact files. A wheel that cannot be installed therefore fails the pull
  # request; while they were built in release.yml, 0.4.0's osx-x64 wheel failed its first
  # install with four registries already published.
  build-wheels:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-wheels.yml@master
    # Same two scopes build-native hands down, for the same reason: the forge attests each
    # wheel and cannot escalate past what this job was granted.
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      # pr: the Pyodide wheel and its in-browser suite only; the native wheels are packaging.
      mode: ${{ github.event_name == 'pull_request' && 'pr' || 'release' }}
      crate: hypercast

  # rust/Cargo.toml publishes categories = ["no-std"], and rust/src/lib.rs is #![no_std]
  # whenever its default-on `std` feature is off. `default = ["std"]` means every other cargo
  # invocation in this pipeline compiles the *std* configuration — HyperForge's
  # cdylib build, its `cargo test --release`, and both `--features` extension
  # builds. Not one of them would notice a `use std::` creeping back into the core: it
  # compiles clean under std, at worst an unused-import warning nothing fails on, and the
  # published claim quietly stops being true with the whole matrix green.
  # `--no-default-features` against a real bare-metal target is the only invocation that
  # compiles the other configuration at all for a consumer — see lib.rs's own comment for
  # why the feature stays default-on (the extensions and the test harness need std).
  #
  # Ported from HyperUuid, which had the claim live and false at its own v0.1.0. The one
  # difference is that this job needs no RUSTFLAGS: HyperUuid points `getrandom` at a custom
  # entropy backend because off std there's no OS to read from, and this crate has no runtime
  # dependencies at all — the core is pure parsing over caller-supplied bytes, so there is
  # nothing to feed. If a dependency ever does arrive here, this is where it will surface.
  #
  # Static analysis only, no native build needed, so this doesn't depend on build-native.
  check-no-std:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown
      - name: cargo check (no_std, bare metal)
        working-directory: rust
        run: cargo check --no-default-features --target thumbv7em-none-eabi

      # The check above only ever passed because a bare-metal target cannot produce a
      # cdylib. Through 0.4.0 the manifest listed one, cargo builds every crate type a
      # dependency lists, and a no_std cdylib has no panic handler — so a
      # `default-features = false` consumer failed on every target that can produce one,
      # which is the developer's own machine and the browser. The manifest now declares
      # only the rlib; this builds a consumer the way one would actually depend on the
      # crate, on both, so the crate type cannot come back unnoticed.
      - name: A default-features = false consumer builds on the host and for wasm32-unknown-unknown
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/no-std-consumer"
          mkdir -p "$consumer/src"
          printf '%s\n' '[package]' 'name = "no-std-consumer"' 'version = "0.0.0"' 'edition = "2024"' '' \
            '[dependencies]' "hypercast = { path = \"$GITHUB_WORKSPACE/rust\", default-features = false }" \
            > "$consumer/Cargo.toml"
          printf '%s\n' '#![no_std]' 'pub use hypercast as core_under_test;' > "$consumer/src/lib.rs"
          cargo build --manifest-path "$consumer/Cargo.toml"
          cargo build --manifest-path "$consumer/Cargo.toml" --target wasm32-unknown-unknown

      # The stronger half of the claim: this crate needs no `alloc` either, so a bare-metal
      # consumer supplies a panic handler and nothing else — no `#[global_allocator]`. The
      # cargo check above does NOT cover that. Without `extern crate alloc` declared, `Vec`
      # and friends aren't in scope and any accidental use already fails it; but adding the
      # declaration deliberately would compile clean, because `cargo check` never links and
      # a missing allocator only ever surfaces at link time — which for an rlib never comes.
      # So the regression to guard is the declaration itself, and grepping for it is a
      # complete guard for exactly that, rather than an approximation of something better.
      #
      # Anchored to the start of a line, so a comment that merely mentions the declaration
      # (HyperUuid's lib.rs has one) is not read as the thing it forbids. The three extension
      # modules are excluded: each sits behind a feature that pulls in std anyway, so none
      # can affect the no_std configuration this job exists to protect.
      - name: assert the core links no allocator
        working-directory: rust
        run: |
          set -euo pipefail
          if grep -rnE '^[[:space:]]*extern crate alloc' src \
               --exclude=python_ext.rs --exclude=ruby_ext.rs --exclude=php_ext.rs; then
            echo '::error::The core declared "extern crate alloc". hypercast documents that a bare-metal consumer needs a panic handler and no global allocator (see rust/README.md no_std section) — either drop the allocation or update that claim.' >&2
            exit 1
          fi
          echo "no allocator dependency in the core"

  # Every door's contract is "never panics on bad input", and at an `extern "C"` boundary a
  # panic is an abort of the host process — so for untrusted text, a reachable bounds check
  # is a crash anyone can trigger. The fuzzer hunts for one; this proves there is none: each
  # C ABI export is wrapped in dtolnay's `#[no_panic]` (the `no-panic` feature), and the
  # link fails, naming the export, if the optimizer left any panic path in it. It has to
  # run every PR rather than once, because whether a bounds check is eliminated is the
  # optimizer's call and can change with nothing in this repo touched — a new stable
  # rustc is enough. Every export is covered, cast_f32/cast_f64 included since the float
  # conversion became this crate's own (float.rs). Linux only: the alias leans on GNU ld's
  # `--no-undefined`, which is what turns no-panic's undefined symbol into an error.
  check-no-panic:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: No C ABI export can panic
        working-directory: rust
        run: cargo no-panic

  # Every binding declares the core's C ABI by hand: C#'s LibraryImports, Java's downcalls
  # and Door table, Go's cgo prototypes, the Swift header, PHP's cdef, Ruby's Fiddle table,
  # and the Python and Ruby extensions' registrations under their own spelling. This holds
  # each of them to the export list in rust/src (.github/scripts/check_exports.py), so a door
  # added to the core and missed in one binding fails here, in seconds, not on the one leg
  # whose suite happens to call it.
  check-exports:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python .github/scripts/check_exports.py

  # The shared library every binding loads is built without std (`cargo cdylib`; the
  # `cdylib` feature in rust/Cargo.toml has why), which leaves it carrying what std used to
  # bring by itself: the C runtime it links, and a hidden `rust_eh_personality` for core's
  # unwind tables. Both are per-platform — `.hidden` on ELF, `.private_extern` on Mach-O,
  # msvcrt on Windows — and a gap in either is a library that links but will not load, so
  # every platform the forge ships is built and loaded here rather than assumed. Each leg
  # checks the export surface is the 27 C ABI symbols and nothing else where the platform's
  # nm can list it, then loads it through Python's ctypes and calls every export with a
  # valid and an invalid input (.github/scripts/cdylib_smoke.py), so the library is dlopen'd
  # and called exactly as a host would. The musl legs build in Alpine and also hold the
  # library to a single NEEDED entry: musl's libc.
  check-cdylib:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, rid: linux-x64, lib: libhypercast.so }
          - { os: ubuntu-26.04-arm, rid: linux-arm64, lib: libhypercast.so }
          - { os: macos-latest, rid: osx-arm64, lib: libhypercast.dylib }
          - { os: windows-latest, rid: win-x64, lib: hypercast.dll }
          - { os: windows-11-arm, rid: win-arm64, lib: hypercast.dll }
          - { os: ubuntu-26.04, rid: linux-musl-x64, lib: libhypercast.so, musl: true }
          - { os: ubuntu-26.04-arm, rid: linux-musl-arm64, lib: libhypercast.so, musl: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.musl }}
      - uses: actions/setup-python@v7
        if: ${{ !matrix.musl }}
        with:
          python-version: "3.x"

      - name: Build the no_std shared library
        if: ${{ !matrix.musl }}
        working-directory: rust
        run: cargo cdylib

      - name: Exports are the 27 C ABI symbols, and nothing else
        if: ${{ !matrix.musl && runner.os != 'Windows' }}
        working-directory: rust
        run: |
          set -euo pipefail
          lib="target/release/${{ matrix.lib }}"
          if [ "$RUNNER_OS" = macOS ]; then
            exports=$(nm -gU "$lib" | awk '$2 == "T" {print $3}' | sed 's/^_//' | sort)
          else
            exports=$(nm -D --defined-only "$lib" | awk '$2 == "T" {print $3}' | sort)
          fi
          echo "$exports"
          count=$(echo "$exports" | wc -l | tr -d ' ')
          extra=$(echo "$exports" | grep -v -E '^(cast_[a-z0-9_]+|hypercast_version)$' || true)
          if [ "$count" != 27 ] || [ -n "$extra" ]; then
            echo "::error::expected the 27 C ABI exports and nothing else, found $count${extra:+ (unexpected: $extra)}"
            exit 1
          fi

      - name: Load it and call every export
        if: ${{ !matrix.musl }}
        shell: bash
        run: python .github/scripts/cdylib_smoke.py "rust/target/release/${{ matrix.lib }}" rust/Cargo.toml

      - name: Build, check, load and call it in Alpine
        if: ${{ matrix.musl }}
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src:ro" python:3-alpine sh -euc '
            apk add --no-cache build-base curl >/dev/null
            curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable >/dev/null 2>&1
            . "$HOME/.cargo/env"
            mkdir /work
            (cd /src && tar cf - --exclude=./rust/target ./rust ./.github/scripts) | tar xf - -C /work
            cd /work/rust
            cargo cdylib
            lib=target/release/libhypercast.so
            needed=$(readelf -d "$lib" | sed -n "s/.*(NEEDED).*\[\(.*\)\]/\1/p" | tr "\n" " ")
            echo "NEEDED: $needed"
            case "$needed" in
              "libc.musl-"*".so.1 ") ;;
              *) echo "::error::$lib must depend on musl libc and nothing else, found: $needed"; exit 1 ;;
            esac
            apk del build-base >/dev/null
            python /work/.github/scripts/cdylib_smoke.py "$lib" Cargo.toml
          '

  # iOS and Mac Catalyst, for the three bindings that reach them. Neither platform loads a
  # library: the core is linked into the app, from the static libraries build-native's
  # build-static-libs job cross-compiles and attests (the forge's apple_mobile input), which
  # are the bytes stage-native-binaries.yml commits for Swift and Go and release.yml packs for
  # C#. This job is the one place they are linked into something and run, and it needs what
  # no build-native leg carries: Xcode, a simulator, and the .NET ios and maccatalyst
  # workloads. Ported from HyperUuid's job of the same name.
  #
  #  * Swift takes them from swift/HyperCastCoreApple.xcframework, which swift/Package.swift
  #    declares only when it is there. The binding's suite runs on an iOS simulator and as a
  #    Mac Catalyst process, and the package is built for an iOS device. It also runs once
  #    more for macOS itself, and the root manifest is built: with the XCFramework present
  #    the manifest declares a second binary target and puts a platform condition on the
  #    first, which is the package a macOS consumer resolves from a tag and the one shape of
  #    it build-native's macOS leg, whose tree has no XCFramework yet, never sees.
  #  * C# takes them from csharp/HyperCast/staticlibs/{rid}/ through
  #    build/net11.0/HyperCast.targets. HyperCast.AppleSmokeTest is the Native AOT smoke
  #    test's Program.cs as an app: run as a Mac Catalyst process, installed and launched in
  #    the simulator, and built for an iOS device with signing off. No runner has a device,
  #    so that last one is proved as far as a link goes: the app's executable must define
  #    the core's symbols.
  #  * Go takes them from go/staticlib/, picked by build tag (lint-docs-go checks the picking
  #    for every platform). The suite runs in the simulator through Go's own wrapper,
  #    misc/ios/go_ios_exec.go, which is how the Go project tests its iOS port. The wrapper
  #    carries the module's files and testdata directories into the simulator and nothing
  #    above the module, so the corpus is staged as go/testdata/corpus (corpus_test.go looks
  #    there too) and the test that reads rust/Cargo.toml is skipped. A device build is
  #    linked and inspected. Mac Catalyst is not linked from Go here: the same archive is
  #    linked and run by Swift and C# above, and Go's part of it is the selection.
  #
  # The simulator hands back neither an exit code nor a console to a launched app, so the C#
  # app also writes what it prints to a file in its container (SmokeLog.cs) and that file is
  # what is checked.
  test-apple-mobile:
    needs: build-native
    # 28 minutes of simulators, behind the slowest build-native leg: release mode only.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    env:
      APP_ID: io.github.skunkwerkx.hypercast.applesmoketest
      SMOKE_PROJECT: csharp/HyperCast.AppleSmokeTest/HyperCast.AppleSmokeTest.csproj
      SMOKE_BIN: csharp/HyperCast.AppleSmokeTest/bin/Release
    steps:
      - uses: actions/checkout@v7

      # Over the checkout: the artifact is laid out by repository path, so the XCFramework
      # lands whole under swift/, the C# archives under csharp/HyperCast/staticlibs/ and the
      # Go ones under go/staticlib/.
      - uses: actions/download-artifact@v8
        with:
          name: static-libs
          path: .

      - name: What is installed, and what was staged
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          (cd swift && xcodebuild -list)
          find swift/HyperCastCoreApple.xcframework -type f | sort
          ls csharp/HyperCast/staticlibs/{ios-arm64,iossimulator-arm64,maccatalyst-arm64,maccatalyst-x64}/libhypercast.a
          ls go/staticlib/{ios_arm64,iossimulator_arm64,maccatalyst_arm64,maccatalyst_amd64}/libhypercast.a

      - name: Boot an iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(n) for n in re.findall(r"\d+", runtime.rsplit("iOS", 1)[-1])]
          for runtime in sorted((r for r in devices if "SimRuntime.iOS" in r), key=version, reverse=True):
              for device in devices[runtime]:
                  if device["name"].startswith("iPhone"):
                      print(device["udid"])
                      sys.exit(0)
          sys.exit("no available iPhone simulator on this image")')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Swift — macOS, with the XCFramework declared
        run: |
          set -euo pipefail
          described=$(cd swift && swift package describe)
          grep -q "HyperCastCoreApple" <<<"$described" \
            || { echo "::error::swift/Package.swift did not declare the XCFramework target"; exit 1; }
          (cd swift && swift test)
          swift build

      - name: Swift — the suite on the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild test -scheme HyperCast -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"

      - name: Swift — the suite as a Mac Catalyst process
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild test -scheme HyperCast -destination "platform=macOS,variant=Mac Catalyst"

      - name: Swift — the package builds for an iOS device
        if: ${{ !cancelled() }}
        working-directory: swift
        run: xcodebuild build -scheme HyperCast -destination "generic/platform=iOS"

      - uses: actions/setup-go@v7
        if: ${{ !cancelled() }}
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Go — the suite in the iOS simulator
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          # `go test` hands a cross-built test binary to go_{GOOS}_{GOARCH}_exec when one is
          # on PATH; Go's wrapper installs it in the booted simulator and runs it there.
          # clangwrap.sh is Go's own too, and targets the simulator SDK. The wrapper predates
          # modules: it copies the package into the app by its path under GOROOT or GOPATH and
          # stops if it is under neither, so it alone runs with the workspace as its GOPATH
          # (go test keeps the real one, and its module cache).
          mkdir -p "$RUNNER_TEMP/go-ios/bin" testdata
          cp -R ../corpus testdata/corpus
          go build -o "$RUNNER_TEMP/go-ios/go_ios_exec" "$(go env GOROOT)/misc/ios/go_ios_exec.go"
          printf '#!/bin/sh\nGOPATH=%q exec %q "$@"\n' "$GITHUB_WORKSPACE" "$RUNNER_TEMP/go-ios/go_ios_exec" \
            > "$RUNNER_TEMP/go-ios/bin/go_ios_arm64_exec"
          chmod +x "$RUNNER_TEMP/go-ios/bin/go_ios_arm64_exec"
          export PATH="$RUNNER_TEMP/go-ios/bin:$PATH"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 CC="$(go env GOROOT)/misc/ios/clangwrap.sh" \
            go test -tags iossimulator -skip '^TestNativeVersionMatchesTheCrate$' -v . | tee "$RUNNER_TEMP/go-ios/test.log"
          grep -q '^ok' "$RUNNER_TEMP/go-ios/test.log"

      - name: Go — an iOS device build links the core in
        if: ${{ !cancelled() }}
        working-directory: go
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/go-ios"
          GOOS=ios GOARCH=arm64 CGO_ENABLED=1 \
            CC="$(xcrun --sdk iphoneos --find clang) -arch arm64 -isysroot $(xcrun --sdk iphoneos --show-sdk-path) -miphoneos-version-min=12.0" \
            go test -c -o "$RUNNER_TEMP/go-ios/hypercast-device.test" .
          nm "$RUNNER_TEMP/go-ios/hypercast-device.test" > "$RUNNER_TEMP/go-ios/device-symbols.txt"
          grep -q " [Tt] _cast_timestamp\$" "$RUNNER_TEMP/go-ios/device-symbols.txt" \
            || { echo "::error::the iOS device test binary does not define cast_timestamp; the core was not linked in"; exit 1; }
          echo "the iOS device test binary defines the core's exports"

      # .NET 11, as build-native's legs take it: HyperCast's floor, preview until the pinned
      # SDK in global.json goes GA.
      - uses: actions/setup-dotnet@v6
        if: ${{ !cancelled() }}
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - name: Install the .NET iOS and Mac Catalyst workloads
        if: ${{ !cancelled() }}
        run: dotnet workload install ios maccatalyst

      - name: C# — a Mac Catalyst app, built and run
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-maccatalyst -r maccatalyst-arm64
          app=$(find "$SMOKE_BIN/net11.0-maccatalyst/maccatalyst-arm64" -maxdepth 1 -name '*.app')
          log="$TMPDIR/hypercast-smoke.log"
          rm -f "$log"
          "$app/Contents/MacOS/HyperCast.AppleSmokeTest"
          cat "$log"
          grep -q "native: available=True version=$want" "$log"
          grep -q "AOT smoke test passed." "$log"

      - name: C# — an iOS app, installed and launched in the simulator
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          want=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          udid="${{ steps.sim.outputs.udid }}"
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-ios -r iossimulator-arm64
          app=$(find "$SMOKE_BIN/net11.0-ios/iossimulator-arm64" -maxdepth 1 -name '*.app')
          xcrun simctl install "$udid" "$app"
          xcrun simctl launch "$udid" "$APP_ID"
          log="$(xcrun simctl get_app_container "$udid" "$APP_ID" data)/tmp/hypercast-smoke.log"
          # The app exits when Program.cs returns; its last line, pass or fail, ends the wait.
          for _ in $(seq 1 60); do
            grep -q -E "AOT smoke test (passed|FAILED)" "$log" 2>/dev/null && break
            sleep 2
          done
          cat "$log"
          grep -q "native: available=True version=$want" "$log"
          grep -q "AOT smoke test passed." "$log"

      - name: C# — an iOS device app links the core in
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          dotnet build "$SMOKE_PROJECT" -c Release -f net11.0-ios -r ios-arm64 -p:EnableCodeSigning=false
          app=$(find "$SMOKE_BIN/net11.0-ios/ios-arm64" -maxdepth 1 -name '*.app')
          nm -g "$app/HyperCast.AppleSmokeTest" > device-symbols.txt
          for symbol in hypercast_version cast_bool cast_timestamp cast_excel_duration; do
            grep -q " T _$symbol\$" device-symbols.txt \
              || { echo "::error::the iOS device app does not define $symbol; the core was not linked in"; exit 1; }
          done
          echo "the iOS device app defines the core's exports"

  # Android, in an emulator, for the three bindings that reach it: C#, Go and Swift.
  #
  # C#: HyperCast.AndroidSmokeTest, which runs the Native
  # AOT smoke test's Program.cs from an Activity, against the package as a MAUI app would
  # take it — packed here from build-native's Android libraries and static-libs archives, and
  # restored from a local folder, so that what is proven is the .nupkg's own layout (NuGet's
  # runtimes/{rid}/native/ into the APK's lib/{abi}/, and build/net11.0/HyperCast.targets
  # handing a Native AOT publish its archive), not a project reference's.
  #
  # Four APKs: CoreCLR (.NET 11's Android runtime; Mono is no longer supported there) and
  # Native AOT, each for android-x64 and android-arm64. The x64 pair runs in an x86_64
  # emulator whose image uses 16 KB pages, as Android 15 devices may, so a library aligned
  # for 4 KB would fail to load there; nothing hosted runs arm64 Android, so the arm64 pair is
  # inspected instead, the same way test-apple-mobile treats an iOS device build. Each
  # CoreCLR APK must carry libhypercast.so for its ABI and pass zipalign -P 16 (the check
  # Google Play applies), and each Native AOT APK must not carry it at all, because the core
  # is linked into the app; the x64 one then passing in the emulator is the proof that it was.
  #
  # Go and Swift: each binding's whole suite, corpus replay included, cross-compiled for
  # Android against this run's archives (the static-libs artifact lands them in go/staticlib
  # and the Swift bundle) and run on the same emulator through adb, by the two scripts that
  # also run it against a local one: android_build_suite.sh and android_device_test.sh.
  # The aarch64 builds are linked, not run. Swift's SDK for Android needs Swift 6.3 or later.
  test-android:
    needs: build-native
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      SMOKE_PROJECT: csharp/HyperCast.AndroidSmokeTest/HyperCast.AndroidSmokeTest.csproj
      SMOKE_DIR: csharp/HyperCast.AndroidSmokeTest
      APP_ID: io.github.skunkwerkx.hypercast.androidsmoketest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-android-*
          path: artifacts

      # Over the checkout, laid out by repository path: the Android archives land in
      # csharp/HyperCast/staticlibs/android-{rid}/.
      - uses: actions/download-artifact@v8
        with:
          name: static-libs
          path: .

      - name: Stage runtimes/android-{rid}/native/
        run: |
          set -euo pipefail
          for rid in android-arm64 android-x64; do
            mkdir -p "csharp/HyperCast/runtimes/$rid/native"
            cp "artifacts/native-$rid/libhypercast.so" "csharp/HyperCast/runtimes/$rid/native/"
            [ -f "csharp/HyperCast/staticlibs/$rid/libhypercast.a" ] \
              || { echo "::error::static-libs has no csharp/HyperCast/staticlibs/$rid/libhypercast.a"; exit 1; }
          done

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      # The android workload's build tasks run on a JDK.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the .NET android workload
        run: dotnet workload install android

      # The restore also reads the .NET 11 daily feed: the android workload this SDK resolves
      # (37.0.0-rc.1) was built against runtime 11.0.0-rc.1.26428.117, a build newer than the
      # RC1 on nuget.org, and a Native AOT publish restores that runtime's NativeAOT and
      # ILCompiler packs by exact version. Drop it once the workload and the SDK agree again
      # (by .NET 11 GA at the latest).
      - name: Pack HyperCast into a local feed
        run: |
          set -euo pipefail
          version="0.0.0-android.${{ github.run_id }}"
          echo "HYPERCAST_VERSION=$version" >> "$GITHUB_ENV"
          echo "HYPERCAST_FEED=$RUNNER_TEMP/feed%3Bhttps://pkgs.dev.azure.com/dnceng/public/_packaging/dotnet11/nuget/v3/index.json" >> "$GITHUB_ENV"
          dotnet pack csharp/HyperCast/HyperCast.csproj -c Release -o "$RUNNER_TEMP/feed" -p:Version="$version"
          unzip -l "$RUNNER_TEMP/feed/HyperCast.$version.nupkg" | tee "$RUNNER_TEMP/nupkg.txt"
          for path in runtimes/android-arm64/native/libhypercast.so runtimes/android-x64/native/libhypercast.so \
                      staticlibs/android-arm64/libhypercast.a staticlibs/android-x64/libhypercast.a; do
            grep -q " $path\$" "$RUNNER_TEMP/nupkg.txt" || { echo "::error::the package has no $path"; exit 1; }
          done

      # Each build from a clean tree, since the CoreCLR and Native AOT builds of one RID share
      # bin/ and obj/; the signed APK is copied out under a name that says which it is.
      - name: Build the four APKs
        run: |
          set -euo pipefail
          mkdir -p apks
          for rid in android-x64 android-arm64; do
            for runtime in coreclr aot; do
              rm -rf "${SMOKE_DIR:?}/bin" "${SMOKE_DIR:?}/obj"
              aot=false
              [ "$runtime" = aot ] && aot=true
              dotnet publish "$SMOKE_PROJECT" -c Release -r "$rid" -p:PublishAot="$aot" \
                -p:HyperCastVersion="$HYPERCAST_VERSION" -p:RestoreAdditionalProjectSources="$HYPERCAST_FEED"
              apk="$(find "$SMOKE_DIR/bin" -name "$APP_ID-Signed.apk" | head -1)"
              [ -n "$apk" ] || { echo "::error::no signed APK for $runtime $rid"; exit 1; }
              cp "$apk" "apks/$runtime-$rid.apk"
            done
          done
          ls -l apks

      - name: Inspect the APKs
        run: |
          set -euo pipefail
          zipalign="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name zipalign | sort -V | tail -1)"
          for rid in android-x64 android-arm64; do
            case "$rid" in android-x64) abi=x86_64 ;; android-arm64) abi=arm64-v8a ;; esac
            unzip -l "apks/coreclr-$rid.apk" | grep -q " lib/$abi/libhypercast.so\$" \
              || { echo "::error::the CoreCLR $rid APK has no lib/$abi/libhypercast.so"; exit 1; }
            "$zipalign" -c -P 16 -v 4 "apks/coreclr-$rid.apk" | grep "libhypercast.so"
            for runtime in coreclr aot; do
              "$zipalign" -c -P 16 4 "apks/$runtime-$rid.apk" \
                || { echo "::error::the $runtime $rid APK fails zipalign -P 16"; exit 1; }
            done
            if unzip -l "apks/aot-$rid.apk" | grep -q "/libhypercast.so\$"; then
              echo "::error::the Native AOT $rid APK carries libhypercast.so; the core should be linked into the app"
              exit 1
            fi
            echo "$rid: the CoreCLR APK carries lib/$abi/libhypercast.so; the Native AOT APK links the core in; both pass zipalign -P 16"
          done

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod

      # After the APKs: setup-swift puts its toolchain's clang first on PATH.
      - uses: SwiftyLab/setup-swift@v1.14.1
        with:
          swift-version: "6.4"

      - name: Go and Swift — cross-build the suites for Android
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for arch in x86_64 aarch64; do
            .github/scripts/android_build_suite.sh go "$arch" "stage/go-$arch"
            .github/scripts/android_build_suite.sh swift "$arch" "stage/swift-$arch"
          done

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the x64 APKs and the Go and Swift suites in an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis_ps16k
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          # One command per line: the action runs each on its own and fails on the first that does.
          script: |
            .github/scripts/android_smoke.sh "$APP_ID" "$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)" apks/coreclr-android-x64.apk apks/aot-android-x64.apk
            .github/scripts/android_device_test.sh stage/go-x86_64 ./hypercast.test -test.v
            .github/scripts/android_device_test.sh stage/swift-x86_64 ./HyperCastPackageTests.xctest

  # Formatting and lints for the crate, its fuzz target and its browser test crate, every
  # PR. rust/rustfmt.toml is the house style; clippy runs over each configuration that
  # compiles different code — the default (with tests and benches), the bare-metal no_std
  # rlib, the no_std shared library, the python extension, and the browser tests on
  # wasm32-unknown-unknown — with warnings as errors. The ruby and php features need their
  # interpreters' headers to compile at all; the forge builds both on every leg, and they
  # were clean when this job was added.
  lint-rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: thumbv7em-none-eabi,wasm32-unknown-unknown
      - name: cargo fmt --check
        working-directory: rust
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path fuzz/Cargo.toml
          cargo fmt --check --manifest-path browser-test/Cargo.toml
      - name: cargo clippy
        working-directory: rust
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --no-default-features --target thumbv7em-none-eabi -- -D warnings
          cargo clippy --no-default-features --features cdylib -- -D warnings
          cargo clippy --features python -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path browser-test/Cargo.toml --target wasm32-unknown-unknown --all-targets -- -D warnings

  # rust-version in rust/Cargo.toml is a promise to every crates.io consumer, and nothing
  # else would notice it going stale: the library and the no_std shared library are built
  # on exactly that toolchain, read from the manifest so the two cannot drift apart. The
  # tests are not part of the promise and use newer APIs.
  check-msrv:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Read rust-version
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rust/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: cargo check on rust-version
        working-directory: rust
        run: |
          cargo check --lib
          cargo check --lib --no-default-features --features cdylib

  # The crate's public API against the latest release on crates.io: a breaking change with
  # a version that does not say so fails here, naming the item. Default features only — the
  # extension features are this repo's own plumbing and need interpreter headers to build.
  # A release bump goes in the same PR as the change (the libraries embed the version), so
  # the version this compares is the one the PR will publish.
  check-semver:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          manifest-path: rust/Cargo.toml
          feature-group: default-features

  # Doc-comment coverage on every real public API surface, every PR — the same bar
  # C#/Java/Rust get from a compiler flag (CS1591+TreatWarningsAsErrors, javadoc -Xwerror,
  # #![deny(missing_docs)]), applied here with the closest per-language equivalent. Each is
  # scoped to the language's own actual public surface, excluding internal FFI plumbing
  # (Runtime/NativePlatform-style helpers) that isn't part of the documented API — the same
  # public/internal boundary those three languages get for free from the compiler. Static
  # analysis only, no native build needed, so these don't depend on build-native.
  lint-docs-go:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # go-version-file only tells setup-go where to read the Go version from — its
          # built-in module cache separately needs cache-dependency-path pointed at go.sum,
          # or it searches the repo root by default and finds nothing (go.mod/go.sum both
          # live under go/, not the root) — real "Restore cache failed" warning otherwise.
          cache-dependency-path: go/go.sum
      - run: go install github.com/mgechev/revive@v1.16.0
      - working-directory: go
        run: revive -config revive.toml ./...
      # Which archive each platform's build links, iOS, Mac Catalyst and the two that must
      # not compile included; the script has why this needs holding to a table.
      - name: Every Go build selects its own platform's archive
        run: .github/scripts/check_go_archives.sh
      # revive does not check layout; gofmt is the formatter, over every file in the module.
      - name: gofmt
        working-directory: go
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run gofmt -w .): $unformatted"
            exit 1
          fi

  lint-docs-python:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install ruff==0.16.5
      # Docstrings and formatting over the whole package — src, tests and bench_cast.py
      # (pyproject.toml's [tool.ruff]).
      - working-directory: python
        run: ruff check .
      - working-directory: python
        run: ruff format --check .

  lint-docs-php:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ffi
      - working-directory: php
        run: composer install --no-progress --prefer-dist
      - working-directory: php
        run: vendor/bin/phpcs

  lint-docs-ruby:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: ruby
      - working-directory: ruby
        run: bundle exec rake docs:check
      # The formatter (.rubocop.yml: layout only) over every Ruby file in the gem.
      - working-directory: ruby
        run: bundle exec rubocop

  lint-docs-swift:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # `swiftlint-static`, not the `swiftlint` beside it in the same download. The dynamic
      # binary links libxml2.so.2, which Ubuntu 26.04 no longer ships (it carries
      # libxml2.so.16), and wants a Swift toolchain's libsourcekitdInProc.so found for it as
      # well. The static one needs neither, so this job installs no Swift at all. It cannot
      # run SourceKit-backed rules, and does not have to: `missing_docs`, the only rule
      # swift/.swiftlint.yml enables, is syntax-only and reports the same violations from
      # both binaries.
      - name: Install SwiftLint
        run: |
          set -euo pipefail
          curl -sSfL -o swiftlint.zip \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/swiftlint_linux_amd64.zip
          mkdir swiftlint_bin
          unzip -q swiftlint.zip -d swiftlint_bin
      - name: Lint
        working-directory: swift
        run: ../swiftlint_bin/swiftlint-static lint --strict Sources

  # The formatters with no doc linter to ride beside: each checks every file of its
  # language — library, tests, benchmarks, smoke tests — against the committed config, and
  # fails on drift. (Rust's is lint-rust's cargo fmt; Go's, Python's, PHP's and Ruby's run
  # in the lint-docs jobs above.)
  format-csharp:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-quality: preview
      # csharp/.editorconfig: tabs, LF, a final newline.
      - working-directory: csharp
        run: dotnet format whitespace HyperCast.slnx --verify-no-changes

  format-java:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      # Spotless with palantir-java-format (java/build.gradle.kts).
      - working-directory: java
        run: ./gradlew --no-daemon spotlessCheck

  format-swift:
    runs-on: ubuntu-26.04
    # swift-format ships in the toolchain, so the formatter is the version of the Swift the
    # matrix builds with (the forge's swift_version).
    container: swift:6.4
    steps:
      - uses: actions/checkout@v7
      # swift/.swift-format: 4-space indent, 120 columns, every lint rule off — layout only.
      - working-directory: swift
        run: >-
          swift format lint --strict --recursive
          Package.swift Sources Tests
          StaticSmokeTest/Package.swift StaticSmokeTest/Sources
          Benchmarks/Package.swift Benchmarks/Benchmarks
