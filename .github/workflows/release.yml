name: Release — publish to real, public registries

# PR -> ci (see ci.yml), tag -> release: this file is the only place a real, permanent,
# public publish can happen. Ported whole from HyperUuid's proven v0.1.0 pipeline.
#
# STATUS after the real v0.0.1 sweep (run 33419045992): four of five legs published for
# real, one failed. Exactly the protocol below — the four that landed are re-gated
# `if: false` so a re-run cannot double-publish where a publish already succeeded, and
# maven-publish stays live because it is the only thing left to prove.
#
#   crates.io   0.0.1 published        -> gated
#   PyPI        0.0.1, 6 wheels        -> gated
#   RubyGems    0.0.1, 5 gems          -> gated
#   nuget.org   0.0.1 published        -> gated
#   Maven       nothing (repo1 404)    -> LIVE, 0.0.1 still free there
#
# The Maven failure was ours, not Central's — it never reached the registry. Gradle failed
# the build at `:sourcesJar`, which packages the main source set and therefore reads
# `build/generated-resources` (stageNativeLibrary's output) without declaring the dependency.
# `ci.yml` runs `./gradlew test`, which never builds sourcesJar, so the publish path was the
# only place it could surface. Fixed in java/build.gradle.kts.
#
# The pack/build jobs feeding a gated publish (nuget-org-pack, pypi-build-wheels) are gated
# alongside it — nothing consumes their output while the publish is off, and pypi-build-wheels
# is a six-leg matrix. Only find-ci-run and maven-publish run until Maven is proven.
#
# Re-run by deleting and recreating the v0.0.1 tag: no new ci.yml run is needed or wanted,
# because the fix is confined to the publish path (ci.yml runs `./gradlew test`, which never
# builds sourcesJar) and find-ci-run walks back to the same already-green run 33415842410.
# The version comes from the checked-out manifests, which say 0.0.1, so Central receives the
# same version the other four already carry.
#
# Once Maven publishes, un-gate all six again — the gates here record "already published at
# 0.0.1", not a permanent decision, and the next release needs every leg live.
#
# The repo-side setup each leg needs is in place, and all of it is org-level at SkunkWerkx
# (shared to public repositories), not per-repo:
#   - nuget-org-publish: nuget.org Trusted Publishing policy pointing at this repo's
#     release.yml, plus the account name in vars.NUGET_TRUSTED_PUBLISHER_USER. It's an org
#     *variable* rather than a literal here specifically so the account can change without a
#     pipeline-code push.
#   - rubygems-publish: rubygems.org Trusted Publishing policy for this repo/workflow.
#   - pypi-publish: PyPI Trusted Publishing (pending publisher) for hypercast.
#   - pack-crates: crates.io token in secrets.CARGO_REGISTRY_TOKEN.
#   - maven-publish: Central Portal token + GPG key in the four MAVEN_* secrets
#     (io.github.skunkwerkx namespace is already approved, proven by HyperUuid).
#
# Why all five at once, and why at v0.0.1: Trusted Publishing has no local test path
# whatsoever — the OIDC exchange only exists inside an Actions runner — so the only way to
# prove a leg is to run it against the real registry. v0.0.1 is the deliberately cheap
# version to find that out on. If a leg blows up, re-gate the ones that succeeded (`if: false`
# on those, so a retag can't double-publish where a publish already landed) and debug the
# failure on its own; the failure is then the only thing a retag exercises.
#
# workflow_dispatch stays enabled while legs are being proven. Once every leg has published
# for real, it comes off this file entirely so a public publish can only ever happen from a
# deliberate tag push.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: >-
          Skip the ci.yml lookup and use this already-green run's artifacts directly. For a
          workflow_dispatch-only fix that never touches anything ci.yml itself builds/tests
          (a publish-job YAML typo, an action version pin, etc.) — re-running the full ~80min
          matrix to re-prove code that didn't change is real waste, not real verification.
          Never used for an actual tag push (tags always go through the real lookup below).
        required: false
        type: string

jobs:
  # ci.yml builds and tests every native leg and uploads the reusable, version-agnostic
  # outputs (plain FFI libs, the Magnus extension) — but never anything that bakes a version
  # into itself (a .nupkg, a .gem, a wheel). This job locates that ci.yml run so every
  # publish job below can pull those reusable artifacts from it; the actual version-sensitive
  # packing (NuGet, RubyGems, PyPI) happens fresh, later in this same file, once the tag
  # makes the real version knowable.
  #
  # The tagged commit is essentially never the exact commit ci.yml last ran against — a
  # "prepare release" version-bump commit and/or stage-native-binaries.yml's own binary-
  # refresh commit typically sit on top of it, both deliberately silent direct pushes with
  # no ci.yml run of their own (ci.yml has no push trigger at all). Neither commit changes
  # anything a registry publish reads from a *built* artifact — a version bump changes
  # manifest text a fresh `cargo publish`/`gradlew publish`/`dotnet pack`/`gem build`/
  # `maturin build` call reads directly from the tagged checkout, not from ci.yml's own
  # (unavoidably pre-bump) build; a binary-refresh commit only touches php/swift/go, which
  # no registry job below even looks at. So walking back a bounded number of ancestor
  # commits looking for ci.yml's real run is correct here, not a compromise.
  find-ci-run:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 10

      - name: Find ci.yml's run for this commit or a recent ancestor
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID_OVERRIDE: ${{ inputs.ci_run_id }}
        run: |
          set -euo pipefail
          if [ -n "$CI_RUN_ID_OVERRIDE" ]; then
            echo "::notice::Using explicit ci_run_id override ($CI_RUN_ID_OVERRIDE) — skipping the ci.yml lookup for this commit." >&2
            echo "run_id=$CI_RUN_ID_OVERRIDE" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for sha in $(git log --format=%H -n 10 "$GITHUB_SHA"); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
              --commit "$sha" --status success --json databaseId --jq '.[0].databaseId')
            if [ -n "$run_id" ]; then
              if [ "$sha" = "$GITHUB_SHA" ]; then
                echo "::notice::Using ci.yml run $run_id from the tagged commit itself." >&2
              else
                echo "::notice::Using ci.yml run $run_id from $sha, an ancestor of the tagged commit." >&2
              fi
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::error::No successful ci.yml run found for $GITHUB_SHA or its last 10 ancestors — dispatch ci.yml by hand against the ref you're tagging (gh workflow run ci.yml --ref <branch-or-sha>) and let it go green before tagging." >&2
          exit 1

  # Packs the .nupkg fresh, right now — deliberately not in ci.yml. A .nupkg bakes its
  # version into its own filename/metadata at pack time, and ci.yml runs before any tag
  # exists, so packing there would always mean a wrong version. This reuses find-ci-run's
  # located run purely for the version-agnostic native binaries + wasm staticlib; the
  # HyperCast.csproj version it actually packs comes from this tagged checkout directly.
  # (The staticlib lands under runtimes/browser-wasm/nativeassets/net10.0/ — the forge's
  # spelling; NuGet's TFM-compatible asset selection serves net10.0 assets to this
  # package's net11.0 consumers, so no forge change needed.)
  #
  # NuGet rejects a duplicate-version republish outright, so this only actually works once
  # HyperCast.csproj's <Version> is bumped past whatever's already published — a real
  # prerequisite "prepare release" is responsible for, not automatic just because this job
  # runs.
  nuget-org-pack:
    if: false  # gated with its publish leg — nothing consumes it while that is off.
    needs: find-ci-run
    uses: SkunkWerkx/.github/.github/workflows/hyper-pack-nuget.yml@master
    with:
      crate: hypercast
      csproj_path: csharp/HyperCast/HyperCast.csproj
      runtimes_dir: csharp/HyperCast/runtimes
      dotnet_version: "11.0.x"
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}

  # No pack step here — nuget-org-pack (above) already produced the .nupkg, in this same
  # release.yml run. This job is purely auth -> download that artifact -> push. The split
  # exists because nuget.org Trusted Publishing validates job_workflow_ref against wherever
  # the executing workflow file physically lives — so the OIDC login must run from THIS
  # repo's own workflow, never from the shared forge (see hyper-pack-nuget.yml's header for
  # the confirmed 401s behind that).
  nuget-org-publish:
    if: false  # PUBLISHED at v0.0.1 — re-gated so a re-run cannot double-publish. See header.
    needs: nuget-org-pack
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "11.0.x"
          dotnet-quality: "preview"

      - uses: actions/download-artifact@v8
        with:
          name: nuget-org-package
          path: nupkg-org

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ vars.NUGET_TRUSTED_PUBLISHER_USER }}

      - name: Publish to nuget.org
        run: >
          dotnet nuget push "nupkg-org/*.nupkg"
          --api-key ${{ steps.login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json

  # Ruby leg: builds the gems fresh, right here — deliberately not in ci.yml. A .gem bakes
  # its version into its own filename/metadata at build time. Reuses find-ci-run's located
  # run purely for the version-agnostic native binaries (Fiddle fallback) + Magnus
  # extension; the gemspec version it actually builds against comes from this tagged
  # checkout directly. Deliberately NOT rubygems/release-gem@v1 — that action always builds
  # (and pushes) exactly one gem itself via `bundle exec rake release`, which doesn't fit
  # "build and publish 5 gems in one job"; configure-rubygems-credentials is the same OIDC
  # exchange release-gem uses internally, called directly so a plain `gem push` per file
  # picks up the resulting credentials.
  rubygems-publish:
    if: false  # PUBLISHED at v0.0.1 — re-gated so a re-run cannot double-publish. See header.
    needs: find-ci-run
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: false
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v8
        with:
          pattern: ruby-native-*
          path: artifacts/ruby-native
          merge-multiple: false
          run-id: ${{ needs.find-ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: ruby

      - name: Build the universal "ruby" platform gem (pure Fiddle, all 6 platforms bundled)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          declare -A LIB_NAMES=(
            [linux-x64]=libhypercast.so
            [linux-arm64]=libhypercast.so
            [osx-x64]=libhypercast.dylib
            [osx-arm64]=libhypercast.dylib
            [win-x64]=hypercast.dll
            [win-arm64]=hypercast.dll
          )
          for rid in "${!LIB_NAMES[@]}"; do
            dest="lib/hypercast/native/$rid"
            mkdir -p "$dest"
            cp "../artifacts/native/native-$rid/${LIB_NAMES[$rid]}" "$dest/"
          done
          bundle exec rake build

      - name: Build precompiled platform gems (Magnus)
        working-directory: ruby
        shell: bash
        run: |
          set -euo pipefail
          declare -A PLATFORMS=(
            [linux-x64]=x86_64-linux
            [linux-arm64]=aarch64-linux
            [osx-x64]=x86_64-darwin
            [osx-arm64]=arm64-darwin
          )
          for rid in "${!PLATFORMS[@]}"; do
            ext=so
            [[ "$rid" == osx-* ]] && ext=bundle
            cp "../artifacts/ruby-native/ruby-native-$rid/hypercast_native.$ext" "lib/hypercast_native.$ext"
            bundle exec rake "native:gem[${PLATFORMS[$rid]}]"
            rm "lib/hypercast_native.$ext"
          done

      # @main per configure-rubygems-credentials' own README — no v2 floating tag exists.
      - uses: rubygems/configure-rubygems-credentials@main

      - name: Publish to rubygems.org
        working-directory: ruby
        run: |
          set -euo pipefail
          for gem in pkg/*.gem; do
            gem push "$gem"
          done

  # PyPI leg: real multi-platform PyO3 native wheels, abi3-py310 — one wheel per platform
  # (not per Python version), so 6 legs covers every supported CPython 3.10+ everywhere.
  # Built fresh, right here — deliberately not in ci.yml, and unlike every other registry
  # in this file, not reusable from ci.yml's run either: a wheel bakes its version into its
  # own filename and metadata at build time (confirmed by HyperUuid directly — maturin has
  # no version-override flag), and maturin's PyO3-bindings mode *is* the compile step,
  # there's no "pack an already-built .so into a wheel" mode the way NuGet/RubyGems have.
  # So this is the one registry that pays for a second, small compile — same 6
  # real-hardware legs build-native already uses, and only at actual release time.
  pypi-build-wheels:
    if: false  # gated with its publish leg — nothing consumes it while that is off.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            rid: linux-arm64
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-26-intel
            rid: osx-x64
            target: x86_64-apple-darwin
            manylinux: ""
          - os: macos-latest
            rid: osx-arm64
            target: aarch64-apple-darwin
            manylinux: ""
          - os: windows-latest
            rid: win-x64
            target: x86_64-pc-windows-msvc
            manylinux: ""
          - os: windows-11-arm
            rid: win-arm64
            target: aarch64-pc-windows-msvc
            manylinux: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux != '' && matrix.manylinux || 'off' }}
          args: --release --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: pypi-wheels-${{ matrix.rid }}
          path: python/dist/*.whl

  pypi-publish:
    if: false  # PUBLISHED at v0.0.1 — re-gated so a re-run cannot double-publish. See header.
    needs: pypi-build-wheels
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pypi-wheels-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # Publishes the rust/ core crate to crates.io — source only, no native artifact needed,
  # so this doesn't depend on find-ci-run the way nuget-org-pack does. cargo publish has no
  # duplicate-version skip either — a hard failure — so a version bump (with Cargo.lock
  # regenerated: cargo publish --locked fails on a stale self-referential entry) is a real
  # prerequisite.
  pack-crates:
    if: false  # PUBLISHED at v0.0.1 — re-gated so a re-run cannot double-publish. See header.
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-crate.yml@master
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Java leg: gradle-maven-publish's publishAndReleaseToMavenCentral does pack, sign,
  # upload, and auto-release in one un-splittable task, so unlike NuGet there's no
  # pack-here/push-there split — the whole leg runs in the forge with this repo's secrets.
  maven-publish:
    needs: find-ci-run
    uses: SkunkWerkx/.github/.github/workflows/hyper-publish-maven.yml@master
    with:
      crate: hypercast
      java_resources_dir: java/src/main/resources/native
      source_run_id: ${{ needs.find-ci-run.outputs.run_id }}
    secrets:
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
      MAVEN_SIGNING_KEY_PASSWORD: ${{ secrets.MAVEN_SIGNING_KEY_PASSWORD }}
