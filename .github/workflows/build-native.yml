name: Build native libraries and test every binding

# The canonical Hyper* pipeline lives in HyperForge (SkunkWerkx/.github):
# 6 real-hardware legs, the Rust core built fresh per leg, every binding's suite run
# against it, and the Python/Ruby suites run twice (forced ctypes/Fiddle fallback +
# PyO3/Magnus extension backends). This file only states what's specific to HyperCast.

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-native:
    uses: SkunkWerkx/.github/.github/workflows/hyper-build-native.yml@master
    with:
      project: HyperCast
      crate: hypercast
      pure_env: HYPERCAST_PURE
      csharp_test_project: csharp/HyperCast.Tests/HyperCast.Tests.csproj
      # net11.0 is the deliberate floor (native discriminated unions make verdict
      # disposition handling a compiler failure), so the preview SDK channel until 11 GAs.
      dotnet_version: "11.0.x"
      dotnet_quality: "preview"
      # The cgo backend is deliberately darwin/linux-only; the purego fallback that will
      # carry Windows and CGO_ENABLED=0 builds is the queued next round.
      go_windows: false
