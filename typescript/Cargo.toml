[package]
name = "hypercast-napi"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# The core as an rlib. The plain doors are called as Rust functions; the validation
# constraints are judged through the core's own C ABI (`cast_checked`, `cast_checked_from_f64`,
# `cast_constraints_check`, `cast_text`, `cast_declared_decimal`), declared in src/lib.rs as
# java/jni declares them, because their raw judges (a `RawConstraints` with its packed `enum`
# beside it) are reachable from outside the crate only there. That needs `exports`, so the .node
# exports the 32 C symbols too, and the WASI module exports the `cast_*` functions beside its
# napi entry points. Harmless as Node and Bun load an addon (dlopen with RTLD_LOCAL), and
# nothing links against the .node. The caveat: an embedder that loads it RTLD_GLOBAL, beside
# another library exporting the same names (a libhypercast of a different version), could see
# one interpose the other's `cast_*` symbols. `std` is named again, as rust/Cargo.toml's
# `exports` comment asks of a consumer that turns the defaults off.
hypercast = { path = "../rust", default-features = false, features = ["std", "exports"] }
# napi10, the Node-API version every Node `engines` admits supports: BigInt (napi6), so cast_i64
# and cast_u64 answer a `bigint` over the whole 64-bit range, and type tags (napi8), so a method
# called on another class's instance is refused by Node before the native cast.
napi = { version = "3", default-features = false, features = ["napi10"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"

[profile.release]
# catch_unwind on every #[napi] function needs an unwinder to catch with, so this stays
# explicit rather than inherited. The core is proven no-panic, so nothing reaches it in practice.
panic = "unwind"
lto = true
codegen-units = 1
strip = "symbols"

# The WASI build only (`npm run build:wasi`). wasm32-wasip1's std ships no unwinder: rustc
# refuses `-C panic=unwind` for it, and cargo never passes that flag for a profile that says
# "unwind" (it emits `-C panic` only for abort), so the release profile's unwind above is
# silently the target's abort there. This profile says abort explicitly, so the rustc line
# carries `-C panic=abort` and a verbose build proves the strategy instead of relying on a
# default. Panics abort in the .wasm and `catch_unwind` has nothing to catch; the TypeScript
# README says so.
[profile.wasi]
inherits = "release"
panic = "abort"
